name: Export Terraria item catalog

on:
  push:
    branches:
      - tooling/item-catalog-export-1458

permissions:
  contents: write

jobs:
  export:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Terraria 1.4.5.8 dedicated server
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://terraria.org/api/download/pc-dedicated-server/terraria-server-1458.zip' -OutFile terraria-server-1458.zip
          Expand-Archive terraria-server-1458.zip -DestinationPath official-server
          $exe = Get-ChildItem official-server -Recurse -Filter TerrariaServer.exe | Where-Object { $_.FullName -match '[\\/]Windows[\\/]' } | Select-Object -First 1
          if (-not $exe) { throw 'Windows TerrariaServer.exe not found in official archive' }
          "TERRARIA_SERVER_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using $($exe.FullName)"
          Get-FileHash $exe.FullName -Algorithm SHA256

      - name: Probe official Item.SetDefaults runtime
        shell: powershell
        run: .\scripts\probe-official-item-runtime.ps1 -ServerExe $env:TERRARIA_SERVER_EXE
